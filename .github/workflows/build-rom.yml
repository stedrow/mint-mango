name: Build ROM

on:
  push:
    tags:
      - "v*"

# Creating the release needs write access to contents; the default GITHUB_TOKEN is read-only,
# which failed the upload step with "Resource not accessible by integration" after a clean build.
permissions:
  contents: write

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip e2fsprogs

      - name: Build launcher APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify release build (minifyEnabled/R8) still compiles
        run: ./gradlew assembleRelease

      - name: Run unit tests
        run: ./gradlew test

      - name: Build ROM image
        run: |
          chmod +x scripts/build-rom.sh scripts/patch-system-files.sh scripts/airpods-aap/y2_aap_l2cap_fix.sh
          scripts/build-rom.sh "${{ github.ref_name }}" app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.ref_name }}/*.zip
          generate_release_notes: true
